name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a newer push supersedes and auto-cancels the
# in-flight run. Ends the overlap class (concurrent runs contending
# for runners/registry and tripping job timeouts on superseded heads
# — observed 2026-09-04, runs 222-238).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-contract:
    name: Backend Unit + Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PipeWire CLI (pactl) for audioRoutingService
        run: sudo apt-get update && sudo apt-get install -y pulseaudio-utils

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend (errors only; warnings are pre-existing baseline)
        working-directory: backend
        run: npm run lint

      - name: Run unit and contract tests with coverage
        working-directory: backend
        run: npm test -- --coverage --maxWorkers=2

      - name: Check coverage ratchet
        working-directory: backend
        run: npm run coverage:check

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install PipeWire CLI (pactl) for audioRoutingService
        run: sudo apt-get update && sudo apt-get install -y pulseaudio-utils

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  scanner-tests:
    name: Scanner Tests
    runs-on: ubuntu-latest
    # Serial job: three npm ci installs + ~1,666 ALNScanner tests with
    # coverage + PWA + config-tool suites — honest worst observed ~14m
    # on slow runners (10m axed run 222 mid-PWA, run 225 mid-config-tool).
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ALNScanner/package-lock.json
            aln-memory-scanner/package-lock.json
            config-tool/package-lock.json

      - name: ALNScanner unit tests with coverage
        working-directory: ALNScanner
        run: npm ci && npm test -- --coverage

      - name: ALNScanner coverage ratchet
        working-directory: ALNScanner
        run: npm run coverage:check

      - name: PWA Scanner unit tests
        working-directory: aln-memory-scanner
        run: npm ci && npm test

      - name: Install backend dependencies (cue-vocabulary linkage test requires backend modules)
        working-directory: backend
        run: npm ci

      - name: Config Tool unit tests
        working-directory: config-tool
        run: npm ci && npm test

      - name: Config Tool lint
        working-directory: config-tool
        run: npm run lint

  esp32-tests:
    name: ESP32 Native Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        working-directory: arduino-cyd-player-scanner
        run: pio test -e native

  scripts-tests:
    name: Notion Sync Scripts Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The A2 byte-parity tests read ALN-TokenData/pack-manifest.json —
          # this was the ONE job checking out without submodules (caught by
          # the first-ever CI run of foundations content, PR #19 run 72).
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run scripts unit tests
        working-directory: scripts
        run: python3 -m pytest tests/ -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-contract, backend-integration, backend-e2e-tier-l, scanner-tests, esp32-tests, scripts-tests]
    # !cancelled(): a run superseded by the concurrency guard must not
    # red its summary — guard cancellations were producing failure
    # notifications on every push (observed runs 238/240/241).
    if: always() && !cancelled()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-unit-contract.result }}" != "success" ]; then
            echo "Backend unit+contract tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-integration.result }}" != "success" ]; then
            echo "Backend integration tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-e2e-tier-l.result }}" != "success" ]; then
            echo "Backend E2E Tier L failed"
            exit 1
          fi
          if [ "${{ needs.scanner-tests.result }}" != "success" ]; then
            echo "Scanner tests failed"
            exit 1
          fi
          if [ "${{ needs.esp32-tests.result }}" != "success" ]; then
            echo "ESP32 tests failed"
            exit 1
          fi
          if [ "${{ needs.scripts-tests.result }}" != "success" ]; then
            echo "Scripts tests failed"
            exit 1
          fi
          echo "All checks passed"

  backend-e2e-tier-l:
    name: Backend E2E Tier L (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Dual-pack gate (A3 slice 0, program §5): the SAME Tier L suite must
      # pass as ALN and as the toy game. Block 2 T1b adds two more legs:
      # the toy pack with lighting.instruments dormant (degrade), and the
      # require-pack fixture pinned to the same dormant profile (the
      # require-vs-degrade contrast). One leg failing must not cancel the
      # others — every verdict is signal.
      fail-fast: false
      matrix:
        include:
          - leg: production
            pack: ''
            profile: ''
          - leg: toy-heist
            pack: tests/e2e/fixtures/packs/toy-heist
            profile: ''
          - leg: toy-dormant-lighting
            pack: tests/e2e/fixtures/packs/toy-heist
            profile: tests/e2e/fixtures/profiles/toy-dormant-lighting.json
          - leg: toy-require-dormant
            pack: tests/e2e/fixtures/packs/toy-heist-require
            profile: tests/e2e/fixtures/profiles/toy-dormant-lighting.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # ALNScanner's npm ci rides the same cache (review CI nit)
          cache-dependency-path: |
            backend/package-lock.json
            ALNScanner/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      # backend/public/gm-scanner symlinks to ALNScanner/dist — build it so
      # Tier L exercises the CURRENT scanner, not a stale committed dist
      - name: Build GM Scanner dist
        working-directory: ALNScanner
        run: npm ci && npm run build

      # The rung-1 software stack (fix-vehicle S5 §8.1): the suite
      # self-provisions its environment through the SHARED module
      # (tests/rung1/provision.js) — session bus, Xvfb, pipewire,
      # witness Home Assistant, mocked BlueZ — so installing the
      # packages is all CI needs for REAL coverage; the video-alert
      # tests used to pass vacuously here (missing fixture) or skip.
      # bluez supplies bluetoothctl (the engine's real client, pointed
      # at the mock); python3-dbusmock supplies the BlueZ mock (with
      # python3-dbus, its C bindings — pip's build of those is broken).
      - name: Install rung-1 stack (VLC + dbus + Xvfb + audio + BT mock)
        run: sudo apt-get update && sudo apt-get install -y vlc-bin vlc-plugin-base dbus xvfb xdotool pipewire pipewire-pulse wireplumber pulseaudio-utils bluez python3-dbusmock python3-dbus

      # Tier L = logic/UI flows only (@hardware excluded). Capability gates
      # make hardware-dependent tests skip LOUDLY where a tool is absent;
      # the manifest reporter prints what was probed. workers=3 is safe for
      # Tier L: per-flow orchestrators bind random ports, memory storage,
      # no UDP discovery in test env, and the system-global resources that
      # force workers=1 (Chromium kiosk, pkill, real AV PID files) are all
      # Tier H concerns.
      # Empty E2E_PACK_PATH/E2E_PROFILE_PATH behave as unset (production
      # ALN-TokenData + the generated simulation profile) — the setup
      # helpers read both with `|| null` (session-env.js, test-server.js).
      - name: Run Tier L E2E
        working-directory: backend
        env:
          E2E_PACK_PATH: ${{ matrix.pack }}
          E2E_PROFILE_PATH: ${{ matrix.profile }}
        run: npm run test:e2e:tier-l

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier-l-playwright-report-${{ matrix.leg }}
          path: backend/playwright-report/
          retention-days: 7
