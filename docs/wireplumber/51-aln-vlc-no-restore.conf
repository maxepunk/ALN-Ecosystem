# ALN orchestrator: do not save or restore stream props/target for VLC.
# The orchestrator owns VLC's stream volume (audioRoutingService).
#
# WirePlumber 0.5+ format (Debian 13 / Raspberry Pi OS Trixie ships
# 0.5.8). Install to:
#   /etc/wireplumber/wireplumber.conf.d/51-aln-vlc-no-restore.conf
# Create that directory first — no package ships /etc/wireplumber.
#
# The 0.4-era Lua equivalent is 51-aln-vlc-no-restore.lua beside this
# file; WirePlumber 0.5 does not read Lua configuration at all.
#
# Procedure and the pw-dump verification: ../../DEPLOYMENT_GUIDE.md
# → "6. Install the WirePlumber rule".
#
# The values are the STRING "false", quoted: WirePlumber's stream
# script compares against the string.

stream.rules = [
  {
    matches = [
      { application.process.binary = "vlc" }
    ]
    actions = {
      update-props = {
        state.restore-props = "false"
        state.restore-target = "false"
      }
    }
  }
]
